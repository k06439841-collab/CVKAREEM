.bg-glow {
    position: fixed;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(255,60,60,0.25), transparent 60%);
    top: -200px;
    left: -200px;
    animation: moveGlow 8s infinite alternate ease-in-out;
    z-index: 0;
}

.bg-glow2 {
    position: fixed;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(255,120,30,0.2), transparent 60%);
    bottom: -150px;
    right: -150px;
    animation: moveGlow2 10s infinite alternate ease-in-out;
    z-index: 0;
}

@keyframes moveGlow {
    from { transform: translate(0,0); }
    to { transform: translate(100px, 80px); }
}

@keyframes moveGlow2 {
    from { transform: translate(0,0); }
    to { transform: translate(-120px, -80px); }
}

.cinematic-box {
    position: relative;
    z-index: 2;
    margin-top: 130px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    border-radius: 25px;
    padding: 50px;
    box-shadow: 0 0 60px rgba(0,0,0,0.7);
    animation: fadeIn 1.2s ease;
}

@keyframes fadeIn {

    to { opacity: 1; transform: translateY(0); }
}

.title {

.subtitle {

.form-control {

    border-radius: 14px;
    padding: 14px;

.form-control:focus {

    border-color: #ff3c3c;

.btn-cinematic {

.btn-cinematic:hover {

<script>
function sendWhatsApp() {
    const name = document.getElementById("nameInput").value.trim();
    const email = document.getElementById("emailInput").value.trim();
    const subject = document.getElementById("subjectInput").value.trim();
    const message = document.getElementById("messageInput").value.trim();

    if (!name || !email || !message) {
        const lang = (window.KH && KH.currentLang) ? KH.currentLang : "en";
        alert(lang === "ar" ? "من فضلك اكتب اسمك وإيميلك ورسالتك الأول" : "Please fill in your name, email, and message first");
        return;
    }

    const phone = "201003935491"; // مصر بدون صفر + كود الدولة 20

    const text =
`Hello Kareem 👋
Name: ${name}
Email: ${email}
Subject: ${subject}
Message: ${message}`;

    const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;

    window.open(url, "_blank");
}
</script>
